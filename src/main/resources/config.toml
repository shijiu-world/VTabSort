# ============================================================
#  VTabSort —— Tab 列表展示（Velocity 代理端，零依赖）
#  三个模式（[display].mode，也可以用 /vts mode <layout|flat|auto> 切）：
#    layout = 固定网格：每列头顶子服名，假人补满空槽
#    flat   = 普通列表：名字前缀子服名 + 可选按人数排序
#    auto   = 在线 ≤ [layout].rows 走 flat，超过走 layout；
#             网格超过客户端上限 80 格时也退回 flat（客户端只渲染前 80 条，
#             硬画网格会整张表错位 —— 这条是保护，不是可选项）
#  实现：1.21.2+ 的 listOrder 协议字段 + 假条目，不碰 scoreboard team。
#  ⚠️ # 之后是注释；没加引号的值不要在同一行再写 #。
# ============================================================

[display]
mode = "auto"          # layout | flat | auto（/vts mode 切换会写回这一行）
hide-loading = false   # 隐藏「还没进任何子服」的玩家（刚连上、切服那一瞬）。
                       #   false = 照样显示：layout 单开一节放最后，flat 给他加前缀；
                       #   写法仍是 header-format / prefix-format，只是 #name# 换成
                       #   [servers.names].loading。

# ------------------------------------------------------------
# layout 模式（auto 落到 layout 时同样生效）
# ------------------------------------------------------------
[layout]
max-columns = 3        # 列预算。人多到一个服装不下一列就续列（也占预算）；
                       #   预算用完，剩下的小服并进最后一列（分节间空一行）。
rows = 20              # 每列行数上限，同时是 auto 的切换阈值。
                       #   网格行数自适应：取「内容需要的高度」与「让客户端
                       #   开出 N 列所需的最小行数」的较大值。
                       # 🔴 客户端写死「每列最多 20 行」（PlayerTabOverlay 里
                       #   while (rows > 20) 就折列）—— 写大于 20 不会「每列多放
                       #   几个人」，只会让整张表错位，而且不会触发 80 条超限警告。
                       #   插件读到大于 20 会夹回 20 并打一条 WARN。
header-format = " &7[#name#&7] - &6#count# &7&l人"   # 列头；#name# = 子服显示名，#count# = 该服总在线
prefix-format = " "    # 玩家名字前缀，默认空 = 不加。#name# = 所在子服显示名。
                       #   填一个空格 = 名字和列头的文字左对齐（列头默认也带前导空格）。
                       #   ⚠️ 装了 TAB 就保持空：两边都写显示名会互相覆盖、前缀来回闪。
separator = true       # 共享列里两个子服分节之间空一行
blank-ping = 1000         # 填充假人的信号延迟（毫秒；0 = 满格，-1 = 无信号=红叉）
header-ping = -1       # 列头右边信号图标的延迟（毫秒）；-1 = 红叉，不写就跟着 blank-ping
show-hat = true        # 皮肤第二层（帽子层）要不要画。占位皮肤的猫耳画在第二层，
                       #   关了就看不见。真人的条目也会一并置成开。
#   default-skin = 填充假人的皮肤，五种写法：
#     ① player:<玩家名>   联网取这个玩家的皮肤（带 Mojang 真签名，最稳）
#     ② 纹理哈希          皮肤网站抄来的 32~80 位十六进制
#     ③ texture:<哈希>    和 TAB 一个写法
#     ④ http://textures.minecraft.net/texture/<哈希>
#     ⑤ 完整 base64 value 需要配对应的 -signature；不给签名也能用
#     ②③④ 不带签名，个别客户端会直接丢弃 → 退回 Steve/Alex。
#     想要一定生效就用 ① 或 ⑤。留空 = 默认 Steve/Alex。
default-skin = ""   # 纯色占位皮肤 #8f8f8f
default-skin-signature = ""   # 只有第 ⑤ 种写法才需要（②③④ 留空即可）
#   column-skin = 列头左边的头像，和 default-skin 互不相干（那只管填充假人）。
#     写法同上。留空 = 退回 default-skin。
column-skin = ""
column-skin-signature = ""

# ------------------------------------------------------------
# flat 模式（auto 落到 flat 时同样生效）
# ------------------------------------------------------------
[flat]
prefix-format = "&8[#name#&8] "   # 名字前缀；#name# = 子服显示名。
                       #   🔴 末尾那个空格是有意的：不加就和名字粘一起（[大厅]名字）
sort = true            # true = 按子服人数降序（平手按服名）；false = 原版顺序

# ------------------------------------------------------------
# Tab 上方/下方（header / footer）
#   行内支持：&0-&f / &l &m &n &o &k / &r、&#RRGGBB、
#             <#RRGGBB>文字</#RRGGBB>（渐变，起止色逐字插值）
#   占位符（按每个玩家本人替换）：
#     %online% 全服在线（含 demo） %server% 当前子服显示名 %server-raw% 子服原名
#     %server-online% 当前子服人数 %player% 自己的名字 %ping% 自己的延迟
#     %time% HH:mm:ss             %date% yyyy-MM-dd
#   认不出来的 %xxx% 原样显示。内容没变不重发包；enabled = false 会清空一次。
#   ⚠️ 里面放了 %time% 就每秒都在变 → 每秒给每个人发一次包（全 diff 失效）。
# ------------------------------------------------------------
[header-footer]
enabled = true
header = [
  "<#FFFFFF>&m                                                </#FFFF00>",
  "&l&#ffadbb欢&#f3b0c2迎&#e7b2c9来&#dbb5d0到&#d0b7d6拾&#c4badd玖&#b8bce4世&#acbfeb界",
  "&#f6d6c3在线玩家数量: &f%online%",
  "&#feceba当前所在服务器: %server%",
]
footer = [
  "&7延迟: &#9adbc5%ping% &7ms",
  "<#FFFFFF>&m                                                </#FFFF00>",
]

# ------------------------------------------------------------
# 子服显示名（列头和前缀里用），也是 /vts demo 的模拟玩家池。
#   0 人的子服整个不出现，不会留空列；没列在这里但有人在线的服
#   照样显示（用服名原文）。列的左右顺序按人数降序，不在这里排。
# ------------------------------------------------------------
[servers.names]
lobby = "&#fa86a9&l传送大厅"
survival = "&#e1f9e8&l生存净土"
survival2 = "&#9adbc5&l生存乐土"
industry = "&#f7cf83&l工业基地"
starvalley = "&#fdb78e&l星露谷"
minigame = "&#fa86a9&l电玩中心"
bedwars = "&#fdb78e&l活动区域"
killer = "&#fdb78e&l限时游戏"
loading = "&7&l正在加载"     # hide-loading=false 时「还没进任何子服」那批人的显示名

# ------------------------------------------------------------
# 每个子服的列头头像（键名 = 子服原名小写，写法和皮肤那几种一样）。
#   回退：本服 → column-skin → default-skin。要签名就再写一条
#   <服名>-signature。
#   下面是「立体按钮」皮肤：脸部 8x8 画的是经典 GUI 按钮的斜面
#   （左上 1px 亮边 / 右下 1px 暗边 / 中间平色），底色取各服名字
#   的颜色，同一色相的亮中暗三档做出凸起感。
#   同色的服共用一份：lobby=minigame，starvalley=bedwars=killer。
# ------------------------------------------------------------
[servers.skins]
lobby               = ""
lobby-signature     = ""

survival            = ""
survival-signature  = ""

survival2           = ""
survival2-signature = ""

industry            = ""
industry-signature  = ""

starvalley          = ""
starvalley-signature= ""

minigame            = ""
minigame-signature  = ""

bedwars             = ""
bedwars-signature   = ""

killer              = ""
killer-signature    = ""

[general]
same-server-order = "name"   # 同一子服内：name = 名字序 / join = 加入顺序

# 命令反馈语
[messages]
reloaded = "配置已重新加载，Tab 已刷新"
reload-failed = "配置加载失败，用的还是旧配置，原因：#reason#"
no-permission = "你没有权限这么做"
usage = "用法：/vtabsort reload | mode <layout|flat|auto> | layout | verify [玩家] | demo | version"

# ------------------------------------------------------------
#   auto-reload = 发现 config.toml 变了就自动重载（按修改时间判断）
#   refresh-delay-ms = 进服/切服后再补一发刷新的延迟（毫秒），0 = 不补
#   reassert-seconds = 周期性校准（秒；0 = 关）：后端会把 listOrder 重置成 0，
#     靠它拉回来。改数值要重启代理生效。
# ------------------------------------------------------------
[advanced]
auto-reload = false
auto-reload-interval-seconds = 3
refresh-delay-ms = 200
reassert-seconds = 3
