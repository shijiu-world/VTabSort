# ============================================================
#  VTabSort —— Tab 列表按子服排序
#  原理：MC 1.21.2+ 的 tab 协议字段 listOrder（客户端原生排序），
#        不碰 scoreboard team —— 小游戏藏名字 / 后端排序不受影响。
#  改完之后：游戏内或控制台敲 /vtabsort reload（需要 vtabsort.reload 权限），
#            或者开着 [advanced].auto-reload 自己会热重载。
#  ⚠️ 写在 # 后面的是注释。没加引号的值不要在同一行再写 # 注释。
# ============================================================

# ------------------------------------------------------------
# 子服优先级：先出现的排在 Tab 列表最前面。
# 服名写 velocity.toml 的 [servers] 里的名字，大小写不敏感。
# 没列进来的服按 [servers].unknown 的规则排。
# ------------------------------------------------------------
[servers]
order = [
    "lobby",      # 传送大厅
    "survival",   # 生存净土
    "survival2",  # 生存乐土
    "industry",   # 工业基地
    "starvalley", # 星露谷
    "minigame",   # 电玩中心
    "bedwars",    # 起床战争
    "killer",     # 限时游戏
]

# 没写进 order 的子服排在哪：
#   after  = 全部排最后（它们之间再按服名/玩家名字排）
#   before = 全部排最前（同上）
unknown = "after"

# ------------------------------------------------------------
# 同一个子服里玩家按什么排：
#   name     = 名字字母序（大小写不敏感）
#   join     = 谁先连上代理谁在前
# ------------------------------------------------------------
[general]
same-server-order = "name"

# ------------------------------------------------------------
# 提示语（命令反馈用）
# ------------------------------------------------------------
[messages]
reloaded = "配置已重新加载，Tab 排序已刷新"
reload-failed = "配置加载失败，用的还是旧配置，原因：#reason#"
no-permission = "你没有权限这么做"
usage = "用法：/vtabsort reload | version"

# ------------------------------------------------------------
# 杂项
#   auto-reload = 改了本文件不用敲命令，自己会在几秒内热重载（按修改时间判断）
#   refresh-delay-ms = 玩家进服/切服后再补一发排序的延迟（毫秒）：
#     tab 条目是别的插件（TAB 等）建的，事件触发时可能还没建好，
#     延迟补一发能兜住这个竞态。0 = 不补。
# ------------------------------------------------------------
[advanced]
auto-reload = false
auto-reload-interval-seconds = 3
refresh-delay-ms = 200
