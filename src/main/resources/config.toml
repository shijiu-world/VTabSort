# ============================================================
#  VTabSort v3 —— Tab 列表展示（Velocity 代理端，零依赖）
#  三种模式（[display].mode 切换，改完 /vtabsort reload）：
#    layout = Hypixel 式固定网格：每列头顶子服名、假人补满。
#             列的左右顺序 = 子服人数降序；一个子服装不下一列就
#             续开一列（列头不变）；列不够时小服并进最后一列。
#    flat   = 普通列表：名字前缀子服名 + 可选按人数降序排序
#    auto   = 自适应：在线人数 ≤ [layout].rows 时走 flat，
#             超过走 layout（人少不铺假人，人多才上网格）
#  原理：1.21.2+ 协议字段 listOrder（客户端原生排序）+ 假条目，
#        不碰 scoreboard team —— 小游戏藏名字不受影响。
#  ⚠️ # 后面是注释；没加引号的值不要在同一行再写 #。
# ============================================================

[display]
mode = "auto"        # layout | flat | auto

# ------------------------------------------------------------
# layout 模式（auto 落地到 layout 时同样生效）
#   rows = 客户端每列行数上限（原版 20），同时是 auto 模式的切换阈值。
#          网格实际行数自适应：取「内容需要的高度」与「让客户端开出
#          N 列所需的最小行数」（4 列≥16 行）的较大值。进服若看到列数
#          不对（如冒出 6 列），把 rows 改成你客户端实测的行数上限（如 15）。
#   max-columns = 列预算。一个子服人多到要续列时，续的列也算在预算里；
#          预算用完后，剩下的小服全部并进最后一列（分节间空一行）。
#          并进去还是超高就允许溢出（网格变形但不丢人）—— 调大这个值或
#          少列几个子服即可消除。
# ------------------------------------------------------------
[layout]
max-columns = 3
rows = 20
header-format = " &7[#name#&7] - &6#count# &7&l人"   # 列头/分节头；#name# = 子服显示名，#count# = 该服总在线数（续列不变）
separator = true       # 共享列里两个子服分节之间空一行
blank-ping = 0         # 假人条目的伪装延迟（毫秒；0 = 满信号）
#   show-hat = 皮肤**第二层**（帽子层）要不要渲染。1.21.4 起协议里多了这个字段，
#     插件建的条目默认是关的 —— 占位皮肤的猫耳画在第二层，关了就看不见。
#     真人的条目也会一并置成开（原版默认就是两层都显示）。
show-hat = true
#   default-skin = 假人皮肤。五种写法都认（推荐第 ① 种）：
#      ① player:<玩家名>      例 "player:Notch" —— **自动联网取该玩家的皮肤**
#         （带 Mojang 真签名），结果缓存到 plugins/vtabsort/skin-cache.properties；
#         起服/重载时先用缓存顶上（不用等网络），同时后台再拉一遍刷新。
#         ⚠️ 需要代理能访问 api.mojang.com（限流时保留旧缓存并打 WARN）。
#      ② 纹理哈希：皮肤网站（mineskin.org / minecraft-heads.com 等）上抄的
#         "Texture URL / hash" 最后那串 64 位十六进制
#      ③ texture:<哈希>（和 TAB 同一个写法）
#      ④ http://textures.minecraft.net/texture/<哈希>
#      ⑤ 完整 base64 value（从 Mojang API 或别人配置里复制的）
#     ②③④ 由插件自己拼属性，**不带签名**。签名是 Mojang 私钥签的，我们造
#     不出来；而有些客户端/版本会直接丢弃无签名的纹理 → 全部退回默认
#     Steve/Alex，且日志里一条错都没有（最难查）。所以**想要一定生效就用
#     ① 或 ⑤**：MineSkin 上传时会一起返回 data.texture.value 和
#     data.texture.signature，把两串分别贴进 xxx 和 xxx-signature 即可
#     （带真签名，signatureRequired 保持 true 也正常显示）。
#     填 ⑤ 时：给了签名就原样用；没给签名插件会把 signatureRequired 关掉。
#     （②③④ 是老玩家最习惯的写法，保留支持，但线上验收时优先看 reload
#      日志那行"皮肤已就绪（N 份带 Mojang 签名）"再排别的问题。）
#     改完 /vts reload 即可（插件会自动重建假条目）。留空 = 默认 Steve/Alex。
default-skin = "101388e165555312f7e20506208b994eee011037bd2d3166adefd6b912a95cfe"   # 纯色占位皮肤 #8f8f8f（已上传到皮肤 CDN）
default-skin-signature = ""   # 只有第 ⑤ 种写法才需要（Mojang API 返回的 signature）
#   column-skin = **列头（子服名那一行）左边的头像**，和上面 default-skin 完全独立：
#     · default-skin 只管网格里的**填充假人**；
#     · column-skin 只管列头那一行的小头像。
#     写法和 default-skin 一模一样（player:名字 / 哈希 / texture: / URL / base64）。
#     没配（留空）就退回 default-skin（老版本升级上来观感不变）。
column-skin = ""
column-skin-signature = ""

# ------------------------------------------------------------
# flat 模式（auto 落地到 flat 时同样生效）
# ------------------------------------------------------------
[flat]
prefix-format = "&8[#name#&8] "   # 名字前缀；#name# = 子服显示名
sort = true            # true = 按子服人数降序（平手服名升序）；false = 原版顺序

# ------------------------------------------------------------
# Tab 上方/下方（header / footer）—— TAB 插件那套的接手版
#   每行都会渲染，行内支持：
#     &0-&f / &l &m &n &o &k / &r                  原版颜色码
#     &#RRGGBB                                      十六进制颜色
#     <#RRGGBB>文字</#RRGGBB>                       渐变（起止色逐字插值，
#                                                   TAB 同一个写法）
#   占位符（按每个玩家本人替换）：
#     %online%        全服在线人数（含 /vts demo 的虚拟玩家）
#     %server%        当前子服显示名（[servers.names]，不在里面就用原名）
#     %server-raw%    子服原名
#     %server-online% 当前子服人数
#     %player%        自己的名字
#     %ping%          自己的延迟（毫秒）
#     %time% / %date% 服务器时间 HH:mm:ss / yyyy-MM-dd
#   ⚠️ 认不出来的 %xxx% 原样显示（不去猜，配错了能看见）。
#   ⚠️ 内容没变化不会重发包；enabled = false 会发一次空内容把已显示的擦掉。
# ------------------------------------------------------------
[header-footer]
enabled = true
header = [
  "<#FFFFFF>&m                                                </#FFFF00>",
  "&l&#ffadbb欢&#f3b0c2迎&#e7b2c9来&#dbb5d0到&#d0b7d6拾&#c4badd玖&#b8bce4世&#acbfeb界",
  "&#f6d6c3在线玩家数量: &f%online%",
  "&#feceba当前所在服务器: %server%",
]
footer = [
  "&7延迟: &#9adbc5%ping% &7ms",
  "<#FFFFFF>&m                                                </#FFFF00>",
]

# ------------------------------------------------------------
# 子服显示名（列头和前缀里用）。同时也是 /vts demo 的模拟玩家池。
#   ⚠️ 这份清单**不**决定谁占分节：列的左右顺序一律按人数降序算，
#      0 人的子服整个不出现（连列头都没有），所以永远不会出现空列。
#      没列在这里但有人在线的服照样会显示（用服名原文当显示名）。
#   ⚠️ v3 删掉了 [servers].order 和 [servers].unknown：列顺序不再由服主排。
# ------------------------------------------------------------
[servers.names]
lobby = "&#fa86a9&l传送大厅"
survival = "&#e1f9e8&l生存净土"
survival2 = "&#9adbc5&l生存乐土"
industry = "&#f7cf83&l工业基地"
starvalley = "&#fdb78e&l星露谷"
minigame = "&#fa86a9&l电玩中心"
bedwars = "&#fdb78e&l活动区域"
killer = "&#fdb78e&l限时游戏"

# ------------------------------------------------------------
# 每个子服的列头头像 —— **颜色 = 该服在 [servers.names] 里的名字颜色**
#   写法和皮肤那几种一样（player:名字 / 纹理哈希 / texture:<哈希> /
#   URL / 完整 base64）。键名就是**子服原名**（小写，和 [servers.names] 一致）。
#   回退顺序：[servers.skins.<本服>] → column-skin → default-skin。
#   需要签名（粘贴完整 base64 时）就再写一条 <服名>-signature。
#   下面是纯色皮肤（64×64 单色 PNG 上传到皮肤 CDN 拿到的哈希）：
#     #fa86a9 / #e1f9e8 / #9adbc5 / #f7cf83 / #fdb78e
#   换配色就重新生成对应颜色的纯色图上传，把哈希换进来。
# ------------------------------------------------------------
[servers.skins]
lobby      = "a86d503d77b9d8da5850f41bba14cab93e5f543b3c34810d1afc0e5e98a58625"   # #fa86a9 传送大厅
survival   = "304e3dcdacd61831fd72721a2237d4e221c8b5bccd33265835d37b52ba66aa4d"   # #e1f9e8 生存净土
survival2  = "d8888b5c3b1eecc2fec9deee42f29668dc26b0d9ad875b844cead708b1940918"   # #9adbc5 生存乐土
industry   = "632e7a90208c5bf79874f180ce472fe7b052fc6a479d276401f25c83edb016e"   # #f7cf83 工业基地
starvalley = "fd816f0f3e2c80584273097290e052b2d928344cdfa05f8127ab8d12086bf490"   # #fdb78e 星露谷
minigame   = "a86d503d77b9d8da5850f41bba14cab93e5f543b3c34810d1afc0e5e98a58625"   # #fa86a9 电玩中心
bedwars    = "fd816f0f3e2c80584273097290e052b2d928344cdfa05f8127ab8d12086bf490"   # #fdb78e 活动区域
killer     = "fd816f0f3e2c80584273097290e052b2d928344cdfa05f8127ab8d12086bf490"   # #fdb78e 限时游戏

[general]
same-server-order = "name"   # 同一子服内：name = 名字序 / join = 加入顺序

# ------------------------------------------------------------
# 提示语（命令反馈用）
# ------------------------------------------------------------
[messages]
reloaded = "配置已重新加载，Tab 已刷新"
reload-failed = "配置加载失败，用的还是旧配置，原因：#reason#"
no-permission = "你没有权限这么做"
usage = "用法：/vtabsort reload | layout | demo | version"

# ------------------------------------------------------------
# 杂项
#   refresh-delay-ms = 玩家进服/切服后再补一发刷新的延迟（毫秒），
#     兜 TAB 建条目的竞态。0 = 不补。
#   reassert-seconds = 周期性校准（秒；0 = 关）：后端 Paper 会把玩家
#     条目的 listOrder 重置回 0、TAB 也可能覆写显示名，靠它拉回来。
#     改这个数值要重启代理才生效（周期起服时定死）。
# ------------------------------------------------------------
[advanced]
auto-reload = false
auto-reload-interval-seconds = 3
refresh-delay-ms = 200
reassert-seconds = 3
